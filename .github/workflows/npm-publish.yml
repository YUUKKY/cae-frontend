# This workflow will run tests using node and then publish a package to GitHub Packages when a release is created
# For more information see: https://docs.github.com/en/actions/publishing-packages/publishing-nodejs-packages

name: Node.js Package

on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          cache: npm
          cache-dependency-path: node_modules/.package-lock.json
          node-version: 16
      
      - name: npm install and build
        run: |
          chmod 777 node_modules/.bin/vue-cli-service
          npm install
          npm run build
      
      - name: npm install and build
        run: |
          chmod 777 node_modules/.bin/vue-cli-service
          npm install
          npm run build
      
      - name: build images
        run: docker build -t cae-frontend:1.0.0 .

      - name: Login to SWR
        run: docker login -u me-east-1@EEWKRHXE5OFSDHGB6LNZ -p ${{ secrets.docker_secret }} swr.me-east-1.myhuaweicloud.com

      - name: Push to SWR
        run: |
          docker tag cae-frontend:1.0.0 swr.me-east-1.myhuaweicloud.com/demo-cae/cae-frontend:1.0.0
          docker push swr.me-east-1.myhuaweicloud.com/demo-cae/cae-frontend:1.0.0

      - uses: yuukky/cae-deploy@main
        name: "Deploy to CAE1"
        with:
          ak: ${{ secrets.HUAWEI_SECRET_ACCESS_KEY }}
          sk: ${{ secrets.SK }}
          project-id: 00248baf96984aecac0f8a976fa7ac00
          region-id: me-east-1
          environment-id: c48fa293-d513-4567-974a-01ca0ed2335f
          application-id: 5cc74cdb-e264-4a63-885d-541ca27fbf56
          component-id: 3e0ea808-5d36-4ec9-8a8d-48fcbbcb029f
          image-address: swr.me-east-1.myhuaweicloud.com/demo-cae/cae-frontend:1.0.0
          component-version: 1.0.1
